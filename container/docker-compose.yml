services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_wizard
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Hila1234
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - ./db/init.sql:/usr/src/app/init.sql
      - ./db/entrypoint.sh:/usr/src/app/entrypoint.sh
      - mssql_data:/var/opt/mssql
    command: bash /usr/src/app/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/db_initialized"]
      interval: 5s
      retries: 20
      start_period: 10s
      timeout: 3s

  api:
    build:
      context: ..
      dockerfile: container/Dockerfile
    container_name: wizard_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=McWizardDB;User Id=sa;Password=Hila1234;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Release
      - ASPNETCORE_URLS=http://+:5173

volumes:
  mssql_data:
